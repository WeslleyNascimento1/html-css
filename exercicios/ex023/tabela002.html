<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: gray;
            border: 1px solid black;
        }

        td.num {
            text-align: right;
        }

        thead, tfoot {
            background-color: gray;
            color: white;
        }

        thead > tr > th {
            position: sticky;
            top: -1px;
            background-color: darkgray;
        }

        tbody > tr:nth-child(odd) {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption>População das Unidades Federativas</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">População</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">46.081.801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.393.441</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17.223.547</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">14.870.907</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="num">11.890.517	</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th scope="col">Total de habitantes</th>
                <td class="num"><strong>111.459.403</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
